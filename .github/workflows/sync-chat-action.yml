name: Sync Chat Action to Standalone Repo

on:
  push:
    branches: [main]
    paths:
      - 'packages/chat-action/**'
      - 'nodes/MaiaRouter/**'
      - 'credentials/MaiaRouterApi.credentials.ts'
      - 'LICENSE.md'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          repository: MAIA-ID/n8n-nodes-maia-router-action
          token: ${{ secrets.ACTION_REPO_TOKEN }}
          path: target-repo

      - name: Sync files to target repo
        run: |
          # Remove old files (keep .git and .github)
          find target-repo -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +

          # Copy package files
          cp packages/chat-action/package.json target-repo/
          cp packages/chat-action/README.md target-repo/
          cp LICENSE.md target-repo/

          # Copy node files
          mkdir -p target-repo/nodes/MaiaRouter
          cp nodes/MaiaRouter/MaiaRouter.node.ts target-repo/nodes/MaiaRouter/
          cp nodes/MaiaRouter/maiaRouter.svg target-repo/nodes/MaiaRouter/

          # Copy credentials
          mkdir -p target-repo/credentials
          cp credentials/MaiaRouterApi.credentials.ts target-repo/credentials/

      - name: Commit and push changes
        run: |
          cd target-repo
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add .

          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -F- <<EOF
          Sync from main repo: ${{ github.sha }}

          Synced from: https://github.com/${{ github.repository }}
          Commit: ${{ github.event.head_commit.message }}
          EOF
            git push
            echo "Changes pushed successfully!"
          fi
