name: Publish to npm

on:
  push:
    tags:
      - 'maia-router-chat-action-v*.*.*'
      - 'maia-router-v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org'

      - name: Determine package to publish
        id: package
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "Tag: $TAG"

          if [[ $TAG == maia-router-chat-action-v* ]]; then
            echo "package=chat-action" >> $GITHUB_OUTPUT
            echo "path=packages/chat-action" >> $GITHUB_OUTPUT
          elif [[ $TAG == maia-router-v* ]]; then
            echo "package=chat-model" >> $GITHUB_OUTPUT
            echo "path=packages/chat-model" >> $GITHUB_OUTPUT
          else
            echo "Unknown tag format: $TAG"
            exit 1
          fi

      - name: Install dependencies
        run: |
          npm ci

      - name: Build package
        run: |
          npm run build

      - name: Prepare package contents
        run: |
          echo "Preparing package contents for: ${{ steps.package.outputs.package }}"
          PACKAGE_PATH="${{ steps.package.outputs.path }}"
          mkdir -p "$PACKAGE_PATH/dist"

          # Always include credentials
          mkdir -p "$PACKAGE_PATH/dist/credentials"
          cp -R dist/credentials/. "$PACKAGE_PATH/dist/credentials/"

          # Include node(s) depending on selected package
          mkdir -p "$PACKAGE_PATH/dist/nodes"
          if [ "${{ steps.package.outputs.package }}" = "chat-action" ]; then
            echo "Copying MaiaRouter node into chat-action package"
            mkdir -p "$PACKAGE_PATH/dist/nodes/MaiaRouter"
            cp -R dist/nodes/MaiaRouter/. "$PACKAGE_PATH/dist/nodes/MaiaRouter/"
          elif [ "${{ steps.package.outputs.package }}" = "chat-model" ]; then
            echo "Copying MaiaRouter and MaiaRouterChatModel nodes into chat-model package"
            mkdir -p "$PACKAGE_PATH/dist/nodes/MaiaRouter"
            cp -R dist/nodes/MaiaRouter/. "$PACKAGE_PATH/dist/nodes/MaiaRouter/"
            mkdir -p "$PACKAGE_PATH/dist/nodes/MaiaRouterChatModel"
            cp -R dist/nodes/MaiaRouterChatModel/. "$PACKAGE_PATH/dist/nodes/MaiaRouterChatModel/"
          fi

          echo "Resulting package dist contents:"
          ls -la "$PACKAGE_PATH/dist"

      - name: Verify build output
        run: |
          echo "Checking dist directory..."
          ls -la dist/
          echo "Checking credentials..."
          ls -la dist/credentials/
          echo "Checking nodes..."
          ls -la dist/nodes/

      - name: Publish to npm
        run: |
          cd ${{ steps.package.outputs.path }}
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Post-publish verification
        run: |
          cd ${{ steps.package.outputs.path }}
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "Published $PACKAGE_NAME@$PACKAGE_VERSION"
          echo "View at: https://www.npmjs.com/package/$PACKAGE_NAME"
