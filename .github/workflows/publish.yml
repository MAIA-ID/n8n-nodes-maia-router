name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (leave empty for package.json version)'
        required: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Verify build output
        run: |
          echo "Checking dist directory..."
          ls -la dist/
          echo "Checking credentials..."
          ls -la dist/credentials/
          echo "Checking nodes..."
          ls -la dist/nodes/
          echo "Checking MaiaRouter node..."
          ls -la dist/nodes/MaiaRouter/
          echo "Checking MaiaRouterChatModel node..."
          ls -la dist/nodes/MaiaRouterChatModel/

      - name: Update version (if manual trigger with version)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.version != ''
        run: npm version ${{ github.event.inputs.version }} --no-git-tag-version

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Post-publish verification
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "Published $PACKAGE_NAME@$PACKAGE_VERSION"
          echo "View at: https://www.npmjs.com/package/$PACKAGE_NAME"
